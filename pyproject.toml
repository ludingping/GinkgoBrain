[project]
name = "ginkgobrain"
version = "0.1.0"
description = "RL-based trading strategy trainer for stocks and crypto using Stable Baselines 3"
requires-python = ">=3.12"
dependencies = [
    # RL framework
    "stable-baselines3>=2.3.0",
    "gymnasium>=0.29.0",
    "sb3-contrib>=2.3.0",
    "ray[rllib]>=2.9.0",
    # Data
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "ccxt>=4.3.0",
    # Technical analysis
    "ta>=0.11.0",
    "pandas-ta>=0.3.14b0",
    # ML baselines (TC-A6 linear baseline, future GBDT combiner utilities)
    "scikit-learn>=1.4.0",
    # Visualization
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "tensorboard>=2.16.0",
    "setuptools<71",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.11",
    "nbformat>=4.2.0",
    "ipywidgets>=8.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
# PyTorch CPU（默认）；GPU 训练时切换为对应 CUDA 版本的 index
# 例如 CUDA 12.1：
#   extra-index-url = ["https://download.pytorch.org/whl/cu121"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
