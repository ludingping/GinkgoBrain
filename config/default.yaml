training:
  algo: ppo
  total_timesteps: 500_000
  policy: MlpPolicy
  algo_kwargs:
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01

env:
  window_size: 20
  initial_balance: 10000.0
  commission: 0.001
  trade_penalty_coef: 1.0
  action_inertia_coef: 0.0
  excess_return_coef: 0.0

stock:
  ticker: "AAPL"
  start: "2020-01-01"
  end: "2024-01-01"
  interval: "1d"
  train_ratio: 0.85

crypto:
  symbol: "BTC/USDT"
  exchange: "binance"
  timeframe: "1d"
  start_date: "2020-01-01 00:00:00"
  end_date: "2026-04-13 00:00:00"
  timezone: "Asia/Shanghai"
  db_table: "public.crypto_kline_binance"
  train_ratio: 0.85
