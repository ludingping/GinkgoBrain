training:
  algo: ppo
  total_timesteps: 500_000
  policy: MlpPolicy
  algo_kwargs:
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01

env:
  window_size: 20
  initial_balance: 10000.0
  commission: 0.001

stock:
  ticker: "AAPL"
  start: "2020-01-01"
  end: "2024-01-01"
  interval: "1d"
  train_ratio: 0.8

crypto:
  symbol: "BTC/USDT"
  exchange: "binance"
  timeframe: "1d"
  since: "2020-01-01"
  limit: 2000
  train_ratio: 0.8
