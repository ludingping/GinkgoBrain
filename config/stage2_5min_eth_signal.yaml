# Stage 2 — 5min ETH signal-layered PPO (trend-following).
# 范式与 BTC 4h 对齐；regime gate 改用 1h SMA50（overlay 层，不在此 yaml）。
# Usage: uv run python train.py --config config/stage2_5min_eth_signal.yaml --paradigm signal_layered
paradigm: signal_layered

training:
  algo: ppo
  policy: MlpPolicy
  total_timesteps: 1_000_000   # SMOKE TEST：原 8M 在 70k step reward 单调劣化（-31→-37）；先 1M 验证调参方向
  n_envs: 8
  backend: sb3
  algo_kwargs:
    learning_rate: 3.0e-5      # 1e-4 太大让 policy 在错误方向滑；降到 3e-5 求稳
    gamma: 0.995
    n_steps: 2048              # 约 1 周 rollout 窗口
    batch_size: 512
    n_epochs: 10
    gae_lambda: 0.95
    clip_range: 0.15
    ent_coef: 0.02             # 0.08 强探索 + 无 trade_penalty → 模型在 noise 上起飞；降到 0.02 让 policy 收敛
  action_masking: false

env:
  window_size: 192             # 5min × 192 = 16 小时视野
  initial_balance: 10000.0
  commission: 0.002            # 0.0005 → 0.002 (×4)：5min PPO 学频繁横跳，加大 commission 让 trade_cost 显著（A 改造）
  risk_aversion_coef: 0.5
  excess_return_coef: 0.5
  action_inertia_coef: 0.001   # 仓位档位变化幅度惩罚（A 改造：复活被 ignore 的设计稿参数）
  trade_penalty_coef: 0.0005   # 每次 action 切换固定惩罚（A 改造）
  stop_atr_mult: 2.5
  stop_cooldown_steps: 72      # 6 小时冷却
  random_start: true

signals:
  config_path: config/signals_v1_5min_eth.yaml   # 由 signal_elimination.py 生成

crypto:
  symbol: "ETH/USDT"
  timeframe: "5min"
  start_date: "2021-01-01 00:00:00"
  end_date:   "2026-04-13 00:00:00"
  timezone: "Asia/Shanghai"
  db_table: "public.crypto_kline_binance"
  train_ratio: 0.80
