# Stage 2 — 1h ETH signal-layered PPO（Plan C：从 5min 退回 1h）。
#
# 背景（5min ETH 的失败）：
#   - 5min ETH PPO 在 1M smoke 上 trades=17604、return=-60.48%、Sharpe=-0.702
#   - A 改造（commission×4 + action_inertia + trade_penalty）后 trades 降到 12360，
#     但 return 反而 -95.88%、Sharpe -1.772，说明 5min 噪声/信号比下 PPO 学不到方向
#   - 退回 1h（噪声仅 5min 的 ~1/3.5），借 BTC 4h 已成功的范式延伸验证 ETH alpha
#
# 与 stage2_1h_signal.yaml（BTC）唯一差异：symbol + signals.config_path
# 训练超参完全沿用 BTC 1h 设计，**不引入** A 改造的 trade penalty 系列
# （1h 频率天然抑制 micro-trade，让默认 commission=0.0005 决定 trade_cost）。
#
# Usage:
#   uv run python scripts/signal_elimination.py --config config/stage2_1h_eth_signal.yaml \
#       --with-contracts \
#       --output config/signals_v1_1h_eth.yaml \
#       --log config/signal_elimination_log_1h_eth.md
#   uv run python train.py --config config/stage2_1h_eth_signal.yaml --paradigm signal_layered
paradigm: signal_layered

training:
  algo: ppo
  policy: MlpPolicy
  total_timesteps: 4_000_000   # 1M smoke 已验证范式可行（+13.31% / Sharpe +0.151）；续训 4M 让 PPO 充分收敛 + 学熊市空仓（CPU 估 ~2h）
  n_envs: 8
  backend: sb3
  algo_kwargs:
    learning_rate: 1.5e-4
    gamma: 0.995
    n_steps: 1024              # 1h × 1024 ≈ 6 周 rollout
    batch_size: 512
    n_epochs: 10
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.05
  action_masking: false

env:
  window_size: 96              # 1h × 96 = 4 天视野（与 4h × 24 同）
  initial_balance: 10000.0
  commission: 0.0005           # Binance taker 默认（1h 频率不需要 ×4 hack）
  risk_aversion_coef: 0.5
  excess_return_coef: 0.5
  stop_atr_mult: 2.0
  stop_cooldown_steps: 6       # ~6h 冷却
  random_start: true

signals:
  config_path: config/signals_v1_1h_eth.yaml   # 由 signal_elimination.py 生成（待跑）

crypto:
  symbol: "ETH/USDT"
  timeframe: "1h"
  start_date: "2022-01-01 00:00:00"
  end_date:   "2026-04-13 00:00:00"
  timezone: "Asia/Shanghai"
  db_table: "public.crypto_kline_binance"
  train_ratio: 0.50              # walk-forward：cut 提前到 ~2024-02，OOS 段 27 月（含 2024-08 ETH mini-bear），验证范式跨 regime 稳健性
