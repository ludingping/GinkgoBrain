  generator: scripts/export_rule_artifact.py
rule:
  kind: gate_vol_target
  symbol: BTC/USDT
  timeframe: 4h
  daily_bars: UTC 1d klines; use only the last fully closed day (open_time + 1d <= now)
  decision_cadence: every closed 4h bar; the daily inputs are those of the last closed UTC day
  gate:
    ma_days: 200
    condition: daily close > SMA(ma_days) (strict)
  exit:
    ma_days: null
    condition: none (pure regime gate)
  vol:
    window_days: 30
    target_ann: 0.3
    floor_level: 1
    levels: 4
    rvol: std(Δlog daily close over window_days, ddof=1) × sqrt(365); NaN/≤0 → level 4
    level: floor(4·min(1, target_ann/rvol) + 0.5) clamped to [floor_level, 4]
    target: level/4 when gate on, 0 when gate off
  target:
    'on': level/4
    'off': 0.0
  min_rebalance_pct: 0.02
  commission: 0.001
  min_daily_bars: 300
  no_model: true
