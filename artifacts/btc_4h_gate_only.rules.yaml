  gate:
    ma_days: 200
    condition: daily close > SMA(ma_days) (strict)
  exit:
    ma_days: null
    condition: none (pure regime gate)
  target:
    'on': 1.0
    'off': 0.0
  min_rebalance_pct: 0.02
  commission: 0.001
  min_daily_bars: 300
  no_model: true
