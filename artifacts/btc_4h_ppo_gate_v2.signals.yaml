    torch: 2.10.0+cu128
    gymnasium: 1.2.2
    numpy: 2.2.6
    pandas: 2.3.3
serving:
  model_class: MaskablePPO
  load: sb3_contrib.MaskablePPO.load(zip); policy.get_distribution(obs, action_masks=mask)
  symbol: BTC/USDT
  timeframe: 4h
  bar_alignment: UTC-aligned buckets (training tz Asia/Shanghai; 8 mod 4 == 0)
  window_size: 24
  n_signals: 10
  state_dim: 4
  obs_shape:
  - 24
  - 14
  obs_contract: 'obs shape (window_size, n_signals + 4). Row i = bar t-window_size+1+i. The LAST row is
    the latest CLOSED bar t: its signals are computed from OHLCV through close[t]; its state features
    are evaluated at close[t] with the position held BEFORE this bar''s action. The action chosen from
    this obs fills at close[t]. Signal columns in `signals` order, then the 4 state columns in `serving.state_features`
    order.'
  state_features:
  - name: position_ratio
    definition: position * close_t / portfolio_value_t, clipped to [0, 1]
  - name: unrealized_pnl
    definition: (close_t - entry_price) / entry_price if long else 0, clipped to [-0.5, 0.5]; entry_price
      is the volume-weighted average of buys since last flat
  - name: steps_since_stop_norm
    definition: min(steps_since_stop, window_size) / window_size; constant 1.0 when the ATR stop is disabled
      (stop_atr_mult <= 0)
  - name: cum_log_return
    definition: log(portfolio_value_t / initial_balance) accumulated UNCLIPPED across the episode, clipped
      to [-1, 1] only when written into the observation
  action_space:
    0: 0.0
    1: 0.25
    2: 0.5
    3: 0.75
    4: 1.0
  min_hold_steps: 3
  lock_rule: after an executed switch to a new target level, the action is frozen at that level for min_hold_steps
    bars (mask = one-hot of the last executed level). Persist last_executed_level and bars_since_change.
    Apply any serving-side risk gate AFTER the lock so the gate can always flatten.
  min_rebalance_pct: 0.02
  commission: 0.001
  stop_loss: none
  min_bars: 500
  episode_note: training episodes are max_episode_steps=540 bars with cum_log_return reset to 0; serving
    should reset cum_log_return on a comparable cadence or accept drift
